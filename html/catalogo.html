<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameHub Store — Catálogo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

<div id="site-header"></div>

<main class="py-5">
  <div class="container-xl">

    <h1 class="fs-4 mb-4">CATÁLOGO</h1>

    <div class="row g-4 align-items-start">

      <!-- FILTROS (sidebar) -->
      <div class="col-12 col-lg-3">
        <div class="panel" style="position:sticky;top:80px;">
          <p class="panel-titulo">Filtros</p>

          <div class="mb-3">
            <label for="filtro-cat" class="form-label">Categoría</label>
            <select id="filtro-cat" class="form-select">
              <option value="">Todas</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="filtro-marca" class="form-label">Marca</label>
            <select id="filtro-marca" class="form-select">
              <option value="">Todas</option>
            </select>
          </div>

          <fieldset class="mb-3">
            <legend class="form-label">Rango de precio (CLP)</legend>
            <div class="mb-2">
              <label for="precio-min" class="form-label">Mínimo</label>
              <input type="number" id="precio-min" class="form-control" placeholder="$ Mínimo" min="0" autocomplete="off">
              <span class="msg-error" id="err-rango">⚠ El mínimo no puede ser mayor que el máximo.</span>
            </div>
            <div>
              <label for="precio-max" class="form-label">Máximo</label>
              <input type="number" id="precio-max" class="form-control" placeholder="$ Máximo" min="0" autocomplete="off">
            </div>
          </fieldset>

          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="filtro-stock">
            <label class="form-check-label" for="filtro-stock" style="font-size:.875rem;">Solo con stock disponible</label>
          </div>

          <button id="btn-limpiar" class="btn btn-ghost w-100">Limpiar filtros</button>
        </div>
      </div>

      <!-- RESULTADOS -->
      <div class="col-12 col-lg-9">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <p class="mb-0" style="color:var(--color-muted);font-size:.875rem;">
            <span id="num-resultados" class="mono" style="color:var(--color-acento);font-weight:600;">0</span> productos
          </p>
          <div class="d-flex align-items-center gap-2">
            <label for="orden" class="form-label mb-0" style="font-size:.8rem;white-space:nowrap;">Ordenar:</label>
            <select id="orden" class="form-select form-select-sm" style="width:auto;">
              <option value="nombre-asc">Nombre A→Z</option>
              <option value="nombre-desc">Nombre Z→A</option>
              <option value="precio-asc">Precio menor</option>
              <option value="precio-desc">Precio mayor</option>
            </select>
          </div>
        </div>

        <div id="grid-catalogo" class="row row-cols-1 row-cols-sm-2 row-cols-xl-3 g-3"></div>

        <div id="estado-vacio" class="vacio" style="display:none;">
          <div class="vacio-icono">🔍</div>
          <h2 class="mt-3">Sin resultados</h2>
          <p>Ajusta los filtros para ver más productos.</p>
        </div>

        <nav id="paginacion" class="d-flex justify-content-center gap-1 mt-4 flex-wrap" aria-label="Paginación de productos"></nav>
      </div>

    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/layout.js"></script>
<script>
  initLayout("catalogo");

  const POR_PAGINA = 6;
  let paginaActual = 1;

  /* Helper para sanitizar texto antes de renderizar (Previene XSS) */
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  /* Poblar selects */
  const selCat = document.getElementById("filtro-cat");
  CATEGORIAS.forEach(c => { 
    const o = document.createElement("option"); 
    o.value = c; 
    o.textContent = c; 
    selCat.appendChild(o); 
  });

  const selMarca = document.getElementById("filtro-marca");
  MARCAS.forEach(m => { 
    const o = document.createElement("option"); 
    o.value = m; 
    o.textContent = m; 
    selMarca.appendChild(o); 
  });

  /* Leer params URL */
  const params = new URLSearchParams(location.search);
  if (params.get("categoria")) selCat.value = params.get("categoria");

  function filtrarYRenderizar() {
    const cat       = selCat.value;
    const marca     = selMarca.value;
    const minRaw    = parseFloat(document.getElementById("precio-min").value);
    const maxRaw    = parseFloat(document.getElementById("precio-max").value);
    const soloStock = document.getElementById("filtro-stock").checked;
    const orden     = document.getElementById("orden").value;

    const errRango = document.getElementById("err-rango");
    const inputMin = document.getElementById("precio-min");
    const inputMax = document.getElementById("precio-max");

    if (!isNaN(minRaw) && !isNaN(maxRaw) && minRaw > maxRaw) {
      errRango.classList.add("visible");
      inputMin.classList.add("invalido");
      inputMax.classList.add("invalido");
      return;
    } else {
      errRango.classList.remove("visible");
      inputMin.classList.remove("invalido");
      inputMax.classList.remove("invalido");
    }

    let res = [...PRODUCTOS];
    if (cat)   res = res.filter(p => p.categoria === cat);
    if (marca) res = res.filter(p => p.marca === marca);
    if (soloStock) res = res.filter(p => p.stock > 0);
    if (!isNaN(minRaw)) res = res.filter(p => precioFinal(p) >= minRaw);
    if (!isNaN(maxRaw)) res = res.filter(p => precioFinal(p) <= maxRaw);
    if (params.get("descuento")) res = res.filter(p => p.descuento > 0);

    switch (orden) {
      case "precio-asc":  res.sort((a,b) => precioFinal(a) - precioFinal(b)); break;
      case "precio-desc": res.sort((a,b) => precioFinal(b) - precioFinal(a)); break;
      case "nombre-desc": res.sort((a,b) => b.nombre.localeCompare(a.nombre)); break;
      default:            res.sort((a,b) => a.nombre.localeCompare(b.nombre));
    }

    document.getElementById("num-resultados").textContent = res.length;

    const total = Math.ceil(res.length / POR_PAGINA);
    if (paginaActual > total) paginaActual = 1;
    const pagina = res.slice((paginaActual - 1) * POR_PAGINA, paginaActual * POR_PAGINA);

    const grid  = document.getElementById("grid-catalogo");
    const vacio = document.getElementById("estado-vacio");
    grid.innerHTML = "";

    if (pagina.length === 0) {
      vacio.style.display = "block";
    } else {
      vacio.style.display = "none";
      pagina.forEach(p => grid.appendChild(crearTarjeta(p)));
    }

    renderPaginacion(total);
  }

  function crearTarjeta(p) {
    const precio  = precioFinal(p);
    const agotado = p.stock === 0;
    const col     = document.createElement("div");
    col.className = "col";
    
    const nombreEsc  = escapeHtml(p.nombre);
    const marcaEsc   = escapeHtml(p.marca);
    const catEsc     = escapeHtml(p.categoria);

    col.innerHTML = `
      <article class="card h-100">
        <div class="tarjeta-img">
          <img src="${imgUrl(p.imagen)}" alt="${nombreEsc}" ${agotado ? 'class="agotado"' : ""} loading="lazy">
          ${p.descuento > 0 ? `<span class="badge-overlay badge-desc">-${p.descuento}%</span>` : ""}
          <span class="badge-overlay ${agotado ? "badge-stock-out" : "badge-stock-ok"}">${agotado ? "⚠ Agotado" : "✓ Stock: "+p.stock}</span>
        </div>
        <div class="card-body d-flex flex-column gap-2 p-3">
          <p class="tarjeta-marca mb-0">${marcaEsc} · ${catEsc}</p>
          <h2 class="tarjeta-nombre mb-0">${nombreEsc}</h2>
          <div class="d-flex align-items-center gap-2">
            <span class="estrellas">${estrellas(p.rating)}</span>
            <span class="rating-count">(${p.resenas})</span>
          </div>
          <div class="d-flex align-items-baseline gap-2 flex-wrap">
            <span class="precio">${fmt(precio)}</span>
            ${p.descuento > 0 ? `<span class="precio-original">${fmt(p.precio)}</span>` : ""}
          </div>
          <div class="d-flex gap-2 mt-auto">
            <a href="/detalle.html?id=${p.id}" class="btn btn-acento btn-sm flex-fill">Ver detalle</a>
            <button class="btn btn-primario btn-sm flex-fill btn-agregar" data-id="${p.id}" ${agotado ? "disabled" : ""}>${agotado ? "Agotado" : "🛒 Agregar"}</button>
          </div>
        </div>
      </article>`;
    return col;
  }

  function renderPaginacion(total) {
    const nav = document.getElementById("paginacion");
    nav.innerHTML = "";
    if (total <= 1) return;

    const ul = document.createElement("ul");
    ul.className = "pagination mb-0";

    const liPrev = document.createElement("li");
    liPrev.className = "page-item" + (paginaActual === 1 ? " disabled" : "");
    liPrev.innerHTML = `<button class="page-link" aria-label="Página anterior">‹</button>`;
    liPrev.querySelector("button").addEventListener("click", () => { 
      if (paginaActual > 1) { 
        paginaActual--; 
        filtrarYRenderizar(); 
        window.scrollTo(0,0); 
      } 
    });
    ul.appendChild(liPrev);

    for (let i = 1; i <= total; i++) {
      const li = document.createElement("li");
      li.className = "page-item" + (i === paginaActual ? " active" : "");
      li.innerHTML = `<button class="page-link" aria-label="Página ${i}">${i}</button>`;
      li.querySelector("button").addEventListener("click", () => { 
        paginaActual = i; 
        filtrarYRenderizar(); 
        window.scrollTo(0,0); 
      });
      ul.appendChild(li);
    }

    const liNext = document.createElement("li");
    liNext.className = "page-item" + (paginaActual === total ? " disabled" : "");
    liNext.innerHTML = `<button class="page-link" aria-label="Página siguiente">›</button>`;
    liNext.querySelector("button").addEventListener("click", () => { 
      if (paginaActual < total) { 
        paginaActual++; 
        filtrarYRenderizar(); 
        window.scrollTo(0,0); 
      } 
    });
    ul.appendChild(liNext);

    nav.appendChild(ul);
  }

  ["filtro-cat","filtro-marca","filtro-stock","orden"].forEach(id => {
    document.getElementById(id).addEventListener("change", () => { paginaActual = 1; filtrarYRenderizar(); });
  });
  ["precio-min","precio-max"].forEach(id => {
    document.getElementById(id).addEventListener("input", () => { paginaActual = 1; filtrarYRenderizar(); });
  });

  document.getElementById("btn-limpiar").addEventListener("click", () => {
    selCat.value = ""; 
    selMarca.value = "";
    document.getElementById("precio-min").value = "";
    document.getElementById("precio-max").value = "";
    document.getElementById("filtro-stock").checked = false;
    document.getElementById("orden").value = "nombre-asc";
    paginaActual = 1;
    filtrarYRenderizar();
  });

  document.getElementById("grid-catalogo").addEventListener("click", e => {
    const btn = e.target.closest(".btn-agregar");
    if (!btn) return;
    if (agregarAlCarrito(Number(btn.dataset.id), 1)) {
      mostrarNotif("Producto agregado al carrito");
      const badge = document.getElementById("carrito-badge");
      if (badge) { 
        const n = cantidadCarrito(); 
        badge.textContent = n; 
        badge.style.display = n > 0 ? "flex" : "none"; 
      }
    }
  });

  filtrarYRenderizar();
</script>
</body>
</html>
