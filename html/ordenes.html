<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameHub Store — Mis Órdenes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

<div id="site-header"></div>

<main class="py-5">
  <div class="container-xl">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
      <h1 class="fs-4 mb-0">MIS ÓRDENES</h1>
      <span class="text-muted-gh" style="font-size:.875rem;">Historial y seguimiento de tus compras</span>
    </div>

    <!-- SIN ÓRDENES -->
    <div id="ordenes-vacias" class="vacio" style="display:none;">
      <div class="vacio-icono">📦</div>
      <h2 class="mt-3">Aún no tienes órdenes registradas</h2>
      <p>Cuando realices una compra, podrás ver el seguimiento de tu paquete aquí.</p>
      <a href="/catalogo.html" class="btn btn-primario mt-3">Ir al catálogo</a>
    </div>

    <!-- LISTADO DE ÓRDENES -->
    <div id="lista-ordenes" class="d-flex flex-column gap-4"></div>

  </div>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/layout.js"></script>
<script>
  initLayout("ordenes");

  /* Datos simulados de órdenes de prueba */
  const ORDENES_MOCK = [
    {
      id: "GH-89021",
      fecha: "2024-11-18",
      estado: "En camino",
      pasoActual: 3,
      total: 1299990,
      productos: [
        { productoId: 1, cantidad: 1 }
      ]
    },
    {
      id: "GH-78104",
      fecha: "2024-10-05",
      estado: "Entregado",
      pasoActual: 4,
      total: 189990,
      productos: [
        { productoId: 4, cantidad: 1 }
      ]
    }
  ];

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function renderOrdenes() {
    const contenedor = document.getElementById("lista-ordenes");
    const vacio = document.getElementById("ordenes-vacias");

    if (ORDENES_MOCK.length === 0) {
      vacio.style.display = "block";
      contenedor.style.display = "none";
      return;
    }

    vacio.style.display = "none";
    contenedor.style.display = "flex";
    contenedor.innerHTML = "";

    ORDENES_MOCK.forEach(orden => {
      const card = document.createElement("div");
      card.className = "panel";

      let productosHtml = "";
      orden.productos.forEach(item => {
        const prod = PRODUCTOS.find(p => p.id === item.productoId);
        if (prod) {
          productosHtml += `
            <div class="d-flex align-items-center gap-3 py-2 border-bottom border-secondary border-opacity-25">
              <img src="${imgUrl(prod.imagen, 100, 75)}" alt="${escapeHtml(prod.nombre)}" style="width:60px;height:45px;object-fit:cover;border-radius:4px;">
              <div class="flex-fill">
                <p class="mb-0 fw-bold" style="font-size:.9rem;">${escapeHtml(prod.nombre)}</p>
                <p class="mb-0 text-muted-gh" style="font-size:.75rem;">Cantidad: ${item.cantidad}</p>
              </div>
              <span class="mono fw-bold" style="font-size:.875rem;">${fmt(precioFinal(prod) * item.cantidad)}</span>
            </div>
          `;
        }
      });

      const pasos = ["Confirmado", "En preparación", "En camino", "Entregado"];
      let timelineHtml = `<div class="timeline">`;
      pasos.forEach((pasoLabel, idx) => {
        const numPaso = idx + 1;
        const completado = numPaso <= orden.pasoActual;
        timelineHtml += `
          <div class="timeline-paso">
            <div class="timeline-circulo ${completado ? "hecho" : ""}">${completado ? "✓" : numPaso}</div>
            <span class="timeline-label ${completado ? "hecho" : ""}">${pasoLabel}</span>
          </div>
        `;
      });
      timelineHtml += `</div>`;

      card.innerHTML = `
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
          <div>
            <span class="fw-bold fs-5 text-acento">${orden.id}</span>
            <span class="text-muted-gh ms-2" style="font-size:.85rem;">· Fecha: ${orden.fecha}</span>
          </div>
          <div>
            <span class="estado-tag bg-primario">${orden.estado}</span>
          </div>
        </div>

        <div class="mb-3">
          ${productosHtml}
        </div>

        ${timelineHtml}

        <div class="d-flex justify-content-between align-items-center mt-4 pt-2 border-top border-secondary border-opacity-25">
          <span class="text-muted-gh" style="font-size:.875rem;">Total pagado:</span>
          <span class="mono fs-5 fw-bold text-acento">${fmt(orden.total)}</span>
        </div>
      `;

      contenedor.appendChild(card);
    });
  }

  renderOrdenes();
</script>
</body>
</html>
